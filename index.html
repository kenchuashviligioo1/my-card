<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>საკონტაქტო ბარათი</title>
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: rgba(21, 30, 49, 0.75);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background: var(--bg-color);
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(99, 102, 241, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(168, 85, 247, 0.15) 0px,
            transparent 50%
          );
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px 16px;
        color: var(--text-main);
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--card-border);
        width: 100%;
        max-width: 420px;
        padding: 36px 24px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        text-align: center;
        animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }

      p.subtitle {
        font-size: 14px;
        color: var(--text-sub);
        margin-bottom: 28px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 15px 20px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.05);
        cursor: pointer;
        width: 100%;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        animation: btnSlideIn 0.5s ease forwards;
      }

      .btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
        flex-shrink: 0;
      }

      .btn:nth-child(1) {
        animation-delay: 0.2s;
      }
      .btn:nth-child(2) {
        animation-delay: 0.3s;
      }
      .btn:nth-child(3) {
        animation-delay: 0.4s;
      }
      .btn:nth-child(4) {
        animation-delay: 0.5s;
      }
      .btn:nth-child(5) {
        animation-delay: 0.6s;
      }

      .btn:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        filter: brightness(1.1);
      }

      .btn:active {
        transform: translateY(-1px) scale(0.99);
      }

      .linkedin {
        background: #0a66c2;
      }
      .instagram {
        background: linear-gradient(
          45deg,
          #f09433 0%,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%
        );
      }
      .phone {
        background: #059669;
      }
      .vcard {
        background: #2563eb;
      }
      .email {
        background: #dc2626;
      }

      @keyframes cardAppear {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes btnSlideIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 18px;
          border-radius: 20px;
        }
        .btn {
          padding: 14px 16px;
          font-size: 14.5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Giorgi Kenchuashvili</h1>
      <p class="subtitle">IT Specialist | Web Developer | Programmer</p>

      <div class="links">
        <!-- 1. LinkedIn -->
        <a
          href="https://www.linkedin.com/in/kenchuashviligioo/"
          target="_blank"
          rel="noopener"
          class="btn linkedin"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.6a1.62 1.62 0 1 0 0 3.2 1.62 1.62 0 0 0 0-3.2z"
            />
          </svg>
          <span>LinkedIn</span>
        </a>

        <!-- 2. Instagram -->
        <a
          href="https://www.instagram.com/kenchuashviligioo/"
          target="_blank"
          rel="noopener"
          class="btn instagram"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
            />
          </svg>
          <span>Instagram</span>
        </a>

        <!-- 3. დარეკვა -->
        <a href="tel:+9955XXXXXXXX" class="btn phone">
          <svg viewBox="0 0 24 24">
            <path
              d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
            />
          </svg>
          <span>Call</span>
        </a>

        <!-- 4. კონტაქტებში შენახვა -->
        <button class="btn vcard" onclick="downloadVCard()">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"
            />
          </svg>
          <span>Add to Contacts</span>
        </button>

        <!-- 5. ელ.ფოსტა -->
        <a href="mailto:YOUR_EMAIL@example.com" class="btn email">
          <svg viewBox="0 0 24 24">
            <path
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
            />
          </svg>
          <span>Send Email</span>
        </a>
      </div>
    </div>

    <script>
      function downloadVCard() {
        const name = "Giorgi Kenchuashvili";
        const phone = "+995597132321";
        const email = "kenchuashviligioo@gmail.com";
        const linkedin = "https://www.linkedin.com/in/kenchuashviligioo/";

        const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:${name}
TEL;TYPE=CELL:${phone}
EMAIL:${email}
URL:${linkedin}
END:VCARD`;

        const blob = new Blob([vCardData], {
          type: "text/vcard;charset=utf-8;",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "contact.vcf";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>
  </body>
</html>
